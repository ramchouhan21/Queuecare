[build-system]
requires = ["setuptools>=65.5.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queuecare-api"
version = "0.1.0"
description = "QueueCare AI FastAPI backend scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.120.0",
  "uvicorn[standard]>=0.23.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.0.0",
  "sqlalchemy>=2.0.0",
  "asyncpg>=0.28.0",
  "firebase-admin>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["app"]
